name: Release

# Push a v* tag: tests run, then goreleaser builds static binaries for
# linux/darwin/windows on amd64/arm64, attaches them with checksums to the
# GitHub release, and pushes a multi-arch image to ghcr.io/allan-nava/latencyprobe.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the release
  packages: write   # the image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go test -race ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
