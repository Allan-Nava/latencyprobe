name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # The probe tests run against a real-time origin in-process, and the
      # origin serves concurrent blocking requests: -race is the point.
      - run: go test -race -count=2 ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/latencyprobe
